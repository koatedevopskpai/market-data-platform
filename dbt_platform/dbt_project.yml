name: "market_data_platform"
version: "1.0.0"
config-version: 2

profile: "market_data_platform"

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

require-dbt-version: [">=1.7.0", "<2.0.0"]

models:
  market_data_platform:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  market_data_platform:
    +schema: raw
