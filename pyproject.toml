[project]
name = "market-data-platform"
version = "1.0.0"
description = "Governed GCP data foundation for financial analytics and AI retrieval"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
